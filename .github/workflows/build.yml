name: Build Panther APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Key fix: Specify Gradle 8.2, do not use system default version
    - name: Setup Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2

    - name: Extract uBlock Extension
      run: unzip app/src/main/assets/uBlock.zip -d app/src/main/assets/uBlock/

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Panther-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
